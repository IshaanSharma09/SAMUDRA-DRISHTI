user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Eliminates Nginx version banner leak

    # Rate limiting zone for Edge DDoS defense
    limit_req_zone $binary_remote_addr zone=edge_limit:10m rate=100r/m;

    upstream backend_cluster {
        server backend:8000;
        keepalive 64;
    }

    upstream frontend_cluster {
        server frontend:3000;
        keepalive 64;
    }

    # =======================================================
    # PRIMARY GATEWAY (HTTP/HTTPS)
    # =======================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost samundra-drishti.gov.in;

        # =======================================================
        # MANDATORY GOVERNMENT-GRADE SECURITY HEADERS
        # =======================================================
        
        # 1. HSTS: Enforces HTTPS across domain and all subdomains for 2 years
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # 2. X-Frame-Options: Neutralizes Clickjacking & UI Redressing
        add_header X-Frame-Options "DENY" always;

        # 3. X-Content-Type-Options: Prevents MIME-Type Sniffing Attacks
        add_header X-Content-Type-Options "nosniff" always;

        # 4. Content-Security-Policy (CSP): Zero-trust script execution (Self only)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none';" always;

        # 5. Referrer Policy & Permissions Policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Apply edge DDoS throttle
        limit_req zone=edge_limit burst=20 nodelay;

        # Route API requests to FastAPI Backend
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Route Documentation & Health endpoints
        location /docs {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route UI traffic to Next.js Frontend
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

# =====================================================================
# SAMUNDRA DRISHTI - HIGH-THROUGHPUT REDIS CONFIGURATION (1M CONCURRENT)
# =====================================================================

# Network & High-Concurrency Socket Tuning
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 65536
timeout 0
tcp-keepalive 300

# Memory Management & LRU Eviction Policy
maxmemory 2gb
maxmemory-policy allkeys-lru      # Evicts least-recently-used keys when RAM threshold is reached
maxmemory-samples 10

# Pure In-Memory Cache Tier
# Disables persistent disk sync to maximize sub-millisecond read/write operations
appendonly no
save ""

# Client limits
maxclients 20000

# Logging
loglevel notice
